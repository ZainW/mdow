name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # apps/native's tests run on Bun.
      - uses: oven-sh/setup-bun@v2
        if: matrix.platform == 'mac'
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
        if: matrix.platform == 'mac'

      - run: pnpm run test
        if: matrix.platform == 'mac'

      # ── macOS: import signing certificate into an explicit keychain ──
      - name: Import Apple signing certificate
        if: matrix.platform == 'mac'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          ls -la "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          # electron-builder CSC_NAME must not include this prefix — it chooses
          # Developer ID Application automatically (otherwise the build fails with
          # "Please remove prefix Developer ID Application: from the specified name")
          IDENTITY="${IDENTITY#Developer ID Application:}"
          IDENTITY="${IDENTITY#"${IDENTITY%%[![:space:]]*}"}"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in $KEYCHAIN_PATH"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_NAME=$IDENTITY" >> "$GITHUB_ENV"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "Using CSC_NAME=$IDENTITY"

      - name: Ensure draft GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # electron-builder only uploads to a draft release; a published
            # release at this tag would make it skip every artifact
            gh release edit "$TAG" --draft || true
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "" 2>/dev/null || true
          fi

      # Windows/Linux: CSC_LINK is unused. Do not pass it on mac — electron-builder
      # 26.15.x (issue 10066) re-imports CSC_LINK into a temp keychain, then calls
      # set-key-partition-list with the .p12 password instead of the keychain password.
      - name: Build and publish
        if: matrix.platform != 'mac'
        run: pnpm run --filter desktop publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and publish (mac)
        if: matrix.platform == 'mac'
        run: pnpm run --filter desktop publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          CSC_NAME: ${{ env.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up keychain
        if: ${{ always() && matrix.platform == 'mac' }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  native-mac:
    env:
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile --filter native

      - name: Check the version matches the tag
        run: test "$(bun -e "console.log(require('./apps/native/package.json').version)")" = "${GITHUB_REF_NAME#v}"

      - run: pnpm --filter native run typecheck
      - run: pnpm --filter native run lint
      - run: pnpm --filter native run test

      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          KEYCHAIN_PATH: ${{ runner.temp }}/native-mac-signing.keychain-db
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PASSWORD=$(uuidgen)

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed and notarized Mdow Native
        shell: bash
        env:
          CI: 'true'
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYCHAIN_PATH: ${{ runner.temp }}/native-mac-signing.keychain-db
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: VERSION="${GITHUB_REF_NAME#v}" bash apps/native/scripts/package-mac.sh

      # Installs of the Rust build update through Sparkle. Keep publishing its feed, pointed at
      # the new zip, so they move to this build once and use the gpuix updater from then on.
      - name: Generate Sparkle migration appcast
        if: env.SPARKLE_PRIVATE_ED_KEY != ''
        run: VERSION="${GITHUB_REF_NAME#v}" DIST_DIR=dist/native-mac bash script/generate_native_mac_appcast.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native-mac
          path: |
            dist/native-mac/*.zip
            dist/native-mac/*.tar.gz*
            dist/native-mac/*.xml
          if-no-files-found: error

      - name: Ensure draft GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""

      - name: Upload Mdow Native for macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            dist/native-mac/MdowNative-*.zip \
            dist/native-mac/*.app.tar.gz* \
            dist/native-mac/*.xml \
            --clobber

      - name: Clean up keychain
        if: ${{ always() }}
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/native-mac-signing.keychain-db
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime dependencies for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-client0 \
            libx11-xcb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            xvfb

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile --filter native

      - name: Build Mdow Native AppImage
        env:
          CI: 'true'
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: VERSION="${GITHUB_REF_NAME#v}" xvfb-run -a bash apps/native/scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/native-linux/*.AppImage*
          if-no-files-found: error

      - name: Ensure draft GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""

      - name: Upload Mdow Native for Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" dist/native-linux/*.AppImage* --clobber

  publish:
    needs:
      - release
      - native-mac
      - native-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Keep releases in draft until the signed Native feed is present. A
          # maintainer can sign locally from Keychain when no CI key is configured.
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx appcast-native-mac.xml
          gh release edit "$TAG" --draft=false --latest
