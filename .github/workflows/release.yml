name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Electron app for Windows and Linux. On macOS, Mdow is the Swift app (mac-app below).
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # apps/native's tests run on Bun.
      - uses: oven-sh/setup-bun@v2
        if: matrix.platform == 'linux'
        with:
          bun-version: 1.4.3

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
        if: matrix.platform == 'linux'

      - run: pnpm run test
        if: matrix.platform == 'linux'

      - name: Ensure draft GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # electron-builder only uploads to a draft release; a published
            # release at this tag would make it skip every artifact
            gh release edit "$TAG" --draft || true
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "" 2>/dev/null || true
          fi

      - name: Build and publish
        run: pnpm run --filter desktop publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mdow on macOS: the Swift app in apps/macos. Released with the same version as the rest, and
  # updated through Sparkle from the feed on the latest release.
  mac-app:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/macos
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          # CFBundleVersion, which Sparkle compares, is the commit count.
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Check the tag matches the app version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DESKTOP="$(jq -r .version ../desktop/package.json)"
          if [[ "$DESKTOP" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($DESKTOP)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the Sparkle key is configured
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_ED_KEY is not set; refusing to release without updates"
            exit 1
          fi

      - run: swift test

      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/mac-app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in $KEYCHAIN_PATH"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using $IDENTITY"

      - name: Build and sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/bundle.sh
          codesign --verify --deep --strict --verbose=2 "dist/Mdow.app"
          codesign --verify --strict -R='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "dist/Mdow.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/Mdow.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/Mdow.app"
          xcrun stapler validate "dist/Mdow.app"
          spctl --assess --type execute --verbose=2 "dist/Mdow.app"

      - name: Zip and write the appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          ZIP="Mdow-$VERSION.zip"
          mkdir -p dist/release
          ditto -c -k --keepParent "dist/Mdow.app" "dist/release/$ZIP"
          # A copy under a fixed name, for links to the latest download.
          cp "dist/release/$ZIP" dist/release/Mdow.zip

          # generate_appcast signs every archive in the folder, so give it only the versioned zip.
          FEED_DIR="$RUNNER_TEMP/appcast"
          rm -rf "$FEED_DIR" && mkdir -p "$FEED_DIR"
          cp "dist/release/$ZIP" "$FEED_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" \
            | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/" \
              --link "https://github.com/$GH_REPO/releases/tag/$GITHUB_REF_NAME" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o "$FEED_DIR/mdow-appcast.xml" \
              "$FEED_DIR"
          cp "$FEED_DIR/mdow-appcast.xml" dist/release/

          grep -F "releases/download/$GITHUB_REF_NAME/$ZIP" dist/release/mdow-appcast.xml >/dev/null \
            || { echo "::error::The appcast does not point at $ZIP"; exit 1; }
          grep -F 'sparkle:edSignature' dist/release/mdow-appcast.xml >/dev/null \
            || { echo "::error::The appcast is missing sparkle:edSignature"; exit 1; }
          cat dist/release/mdow-appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: mdow-mac
          path: apps/macos/dist/release/
          if-no-files-found: error

      - name: Ensure draft GitHub release exists
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""

      - name: Upload Mdow for Mac
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/release/Mdow-$VERSION.zip" \
            dist/release/Mdow.zip \
            dist/release/mdow-appcast.xml \
            --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/mac-app-signing.keychain-db" 2>/dev/null || true

  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime dependencies for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-client0 \
            libx11-xcb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            xvfb

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: pnpm install --frozen-lockfile --filter native

      - name: Build Mdow Native AppImage
        env:
          CI: 'true'
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: VERSION="${GITHUB_REF_NAME#v}" xvfb-run -a bash apps/native/scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/native-linux/*.AppImage*
          if-no-files-found: error

      - name: Ensure draft GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""

      - name: Upload Mdow Native for Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" dist/native-linux/*.AppImage* --clobber

  publish:
    needs:
      - release
      - mac-app
      - native-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Keep the release in draft until the Mac app's signed update feed is on it.
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx mdow-appcast.xml
          gh release edit "$TAG" --draft=false --latest
