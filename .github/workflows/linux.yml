name: Linux

# Builds and tests Mdow for Linux (the Rune app in apps/rune) as an AppImage and a Flatpak bundle,
# and uploads them as artifacts. Releases are built by release.yml, which calls this workflow from
# the same `vX.Y.Z` tags as the Mac app and attaches both bundles to the release.
'on':
  pull_request:
    paths:
      - 'apps/rune/**'
      - '.github/workflows/linux.yml'
  push:
    branches: [main]
    paths:
      - 'apps/rune/**'
      - 'package.json'
      - '.github/workflows/linux.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The app finds the desktop's libraries when it runs, but Rune's test harness links
      # xkbcommon when it is built.
      - name: Install libxkbcommon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev

      # Rune pins its toolchain in apps/rune/rust-toolchain.toml.
      - name: Install Rust
        working-directory: apps/rune
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --component clippy --component rustfmt
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rune

      - name: Check
        working-directory: apps/rune
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build AppImage
        run: bash apps/rune/packaging/appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/linux/*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          echo "version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)" >> "$GITHUB_OUTPUT"

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: apps/rune/packaging/com.zain.mdow.yml
          bundle: Mdow-${{ steps.version.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('apps/rune/Cargo.lock') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: Mdow-*.flatpak
          if-no-files-found: error
