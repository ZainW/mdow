name: Linux (GTK)

# Builds Mdow for Linux (apps/native-linux) as an AppImage and a Flatpak bundle.
#   - pull requests: build and test only
#   - pushes to main: refresh the rolling `linux-latest` pre-release
#   - tags `linux-<version>`: publish a versioned pre-release
'on':
  pull_request:
    paths:
      - 'apps/native-linux/**'
      - 'apps/native/assets/**'
      - '.github/workflows/linux.yml'
  push:
    branches: [main]
    tags: ['linux-[0-9]*']
    paths:
      - 'apps/native-linux/**'
      - 'apps/native/assets/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK 4 and libadwaita
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev adwaita-icon-theme \
            librsvg2-common file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native-linux

      - name: Check
        working-directory: apps/native-linux
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build AppImage
        run: bash apps/native-linux/packaging/appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/native-linux/*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/native-linux/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: apps/native-linux/packaging/com.zain.mdow.Linux.yml
          bundle: Mdow-${{ steps.version.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('apps/native-linux/Cargo.lock') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Mdow-*.flatpak
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && ls -la

      - name: Publish versioned pre-release
        if: startsWith(github.ref, 'refs/tags/linux-')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/native-linux/Cargo.toml | head -1)"
          if [[ "$TAG" != "linux-$VERSION" ]]; then
            echo "Tag $TAG does not match apps/native-linux/Cargo.toml version $VERSION" >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --verify-tag \
              --title "Mdow for Linux $VERSION (preview)" \
              --notes-file apps/native-linux/packaging/release-notes.md
          gh release upload "$TAG" assets/* --clobber

      - name: Refresh linux-latest
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/native-linux/Cargo.toml | head -1)"
          gh release delete linux-latest --yes --cleanup-tag 2>/dev/null || true
          {
            echo "Rolling build of \`main\` at ${GITHUB_SHA::7} (version $VERSION). It is replaced on every push that touches the Linux app."
            echo
            cat apps/native-linux/packaging/release-notes.md
          } > notes.md
          gh release create linux-latest --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Mdow for Linux (latest main build)" --notes-file notes.md assets/*
