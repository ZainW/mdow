[package]
name = "mdow-linux"
version = "1.15.0"
edition = "2024"
description = "Mdow for Linux: a quiet markdown viewer built on GTK 4 and libadwaita"
license = "MIT"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
pango = { version = "0.22", features = ["v1_56"] }
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
comrak = { version = "0.56", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
htmd = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
