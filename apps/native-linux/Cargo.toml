[package]
name = "mdow-linux"
version = "1.15.0"
edition = "2024"
description = "Mdow for Linux: a quiet markdown viewer built on GTK 4 and libadwaita"
license = "MIT"
publish = false

[dependencies]
async-channel = "2"
libc = "0.2"
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images", "svgz"] }
comrak = { version = "0.59", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
htmd = "0.5"
pangocairo = "0.22"
ratex-layout = "0.1"
ratex-parser = "0.1"
ratex-svg = { version = "0.1", features = ["embed-fonts"] }
ratex-types = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
