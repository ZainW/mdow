<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' mdow-local: data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' mdow-local:"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Mdow</title>
    <script>
      // Apply the theme before first paint. Electron's nativeTheme drives prefers-color-scheme,
      // and the saved theme is applied to it before this window is created.
      document.documentElement.classList.toggle(
        'dark',
        matchMedia('(prefers-color-scheme: dark)').matches,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
