[package]
name = "mdow-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
async-channel = "=2.5.0"
url = "=2.5.8"
gpui = "=0.2.2"
image = { version = "0.25", default-features = false }
# No "math" feature: it pulls rust-embed (and, through gpui's feature set, bstr) into
# merman-render, which then fails type inference in 0.8.0-alpha.6 (fixed upstream in e3484ed).
merman = { version = "=0.8.0-alpha.6", default-features = false, features = [
  "svg",
  "layout-cytoscape",
] }
notify = "=8.2.0"
open = "=5.4.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts", "standalone"] }
ratex-types = "=0.1.14"
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
ttf-parser = "=0.25.1"
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "=3.27.0"
